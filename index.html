<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bluesky Column Feed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth scrolling for column navigation */
        .columns-container {
            scroll-behavior: smooth;
        }
        /* Prevent pull-to-refresh on mobile */
        body {
            overscroll-behavior-y: contain;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ChevronLeft = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        );

        const ChevronRight = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );

        const RefreshCw = ({ className }) => (
            <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
        );

        const AlertCircle = ({ className }) => (
            <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        const LogOut = ({ className }) => (
            <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        );

        const BlueskyColumnFeed = () => {
            const [posts, setPosts] = useState([]);
            const [loading, setLoading] = useState(false);
            const [currentColumn, setCurrentColumn] = useState(0);
            const [handle, setHandle] = useState('');
            const [password, setPassword] = useState('');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [session, setSession] = useState(null);
            const [error, setError] = useState('');

            const POSTS_PER_COLUMN = 3;
            const COLUMNS_TO_SHOW = 2;

            // Check for saved session on load
            useEffect(() => {
                const savedSession = localStorage.getItem('bluesky_session');
                if (savedSession) {
                    try {
                        const sessionData = JSON.parse(savedSession);
                        setSession(sessionData);
                        setIsLoggedIn(true);
                        fetchTimeline(sessionData.accessJwt);
                    } catch (e) {
                        localStorage.removeItem('bluesky_session');
                    }
                }
            }, []);

            const login = async () => {
                setLoading(true);
                setError('');
                try {
                    const response = await fetch('https://bsky.social/xrpc/com.atproto.server.createSession', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            identifier: handle,
                            password: password
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.message || 'Login failed. Check your credentials.');
                    }

                    const data = await response.json();
                    setSession(data);
                    setIsLoggedIn(true);
                    localStorage.setItem('bluesky_session', JSON.stringify(data));
                    await fetchTimeline(data.accessJwt);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const logout = () => {
                setIsLoggedIn(false);
                setSession(null);
                setPosts([]);
                setHandle('');
                setPassword('');
                localStorage.removeItem('bluesky_session');
            };

            const fetchTimeline = async (token) => {
                setLoading(true);
                setError('');
                try {
                    const response = await fetch(
                        'https://bsky.social/xrpc/app.bsky.feed.getTimeline?limit=50',
                        {
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            }
                        }
                    );

                    if (!response.ok) {
                        throw new Error(`Failed to fetch timeline: ${response.status}`);
                    }

                    const data = await response.json();
                    setPosts(data.feed || []);
                    setCurrentColumn(0);
                } catch (err) {
                    setError(`Error loading feed: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const refresh = () => {
                if (session) {
                    fetchTimeline(session.accessJwt);
                }
            };

            const totalColumns = Math.ceil(posts.length / POSTS_PER_COLUMN);
            const maxColumnIndex = Math.max(0, totalColumns - COLUMNS_TO_SHOW);

            const getColumnPosts = (columnIndex) => {
                const start = columnIndex * POSTS_PER_COLUMN;
                const end = start + POSTS_PER_COLUMN;
                return posts.slice(start, end);
            };

            const formatTimeAgo = (timestamp) => {
                const now = new Date();
                const posted = new Date(timestamp);
                const diffMs = now - posted;
                const diffMins = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMins / 60);
                const diffDays = Math.floor(diffHours / 24);

                if (diffMins < 1) return 'now';
                if (diffMins < 60) return `${diffMins}m`;
                if (diffHours < 24) return `${diffHours}h`;
                return `${diffDays}d`;
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 flex items-center justify-center">
                        <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
                            <div className="text-center mb-6">
                                <h1 className="text-3xl font-bold text-indigo-600 mb-2">Bluesky Column Feed</h1>
                                <p className="text-gray-600">View your timeline in columns</p>
                            </div>
                            
                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 flex gap-2">
                                    <AlertCircle className="w-5 h-5 flex-shrink-0 mt-0.5" />
                                    <span className="text-sm">{error}</span>
                                </div>
                            )}

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Handle or Email
                                    </label>
                                    <input
                                        type="text"
                                        value={handle}
                                        onChange={(e) => setHandle(e.target.value)}
                                        placeholder="username.bsky.social"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        onKeyPress={(e) => e.key === 'Enter' && !loading && handle && password && login()}
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        App Password
                                    </label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="••••-••••-••••-••••"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        onKeyPress={(e) => e.key === 'Enter' && !loading && handle && password && login()}
                                    />
                                </div>

                                <button
                                    onClick={login}
                                    disabled={loading || !handle || !password}
                                    className="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
                                >
                                    {loading ? 'Logging in...' : 'Login'}
                                </button>
                            </div>

                            <div className="mt-6 p-4 bg-blue-50 rounded-lg">
                                <p className="text-xs text-gray-700">
                                    <strong>Tip:</strong> Use an App Password (not your main password) for security. 
                                    Create one in Settings → App Passwords on Bluesky.
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
                    {/* Header */}
                    <div className="bg-white shadow-md sticky top-0 z-10">
                        <div className="px-4 py-3 flex items-center justify-between">
                            <div>
                                <h1 className="text-xl font-bold text-indigo-600">Your Timeline</h1>
                                <p className="text-xs text-gray-500">@{session?.handle}</p>
                            </div>
                            <div className="flex gap-2">
                                <button
                                    onClick={refresh}
                                    disabled={loading}
                                    className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                                    title="Refresh"
                                >
                                    <RefreshCw className={`w-5 h-5 text-indigo-600 ${loading ? 'animate-spin' : ''}`} />
                                </button>
                                <button
                                    onClick={logout}
                                    className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                                    title="Logout"
                                >
                                    <LogOut className="w-5 h-5 text-indigo-600" />
                                </button>
                            </div>
                        </div>
                        
                        {/* Error banner */}
                        {error && (
                            <div className="px-4 pb-3">
                                <div className="bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg text-sm flex gap-2">
                                    <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                                    <span>{error}</span>
                                </div>
                            </div>
                        )}
                        
                        {/* Navigation */}
                        {posts.length > 0 && (
                            <div className="px-4 pb-3 flex items-center justify-between border-t border-gray-200 pt-3">
                                <button
                                    onClick={() => setCurrentColumn(Math.max(0, currentColumn - 1))}
                                    disabled={currentColumn === 0}
                                    className="p-2 hover:bg-gray-100 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed"
                                >
                                    <ChevronLeft />
                                </button>
                                
                                <span className="text-sm text-gray-600">
                                    Columns {currentColumn + 1}-{Math.min(currentColumn + COLUMNS_TO_SHOW, totalColumns)} of {totalColumns}
                                </span>
                                
                                <button
                                    onClick={() => setCurrentColumn(Math.min(maxColumnIndex, currentColumn + 1))}
                                    disabled={currentColumn >= maxColumnIndex}
                                    className="p-2 hover:bg-gray-100 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed"
                                >
                                    <ChevronRight />
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Loading State */}
                    {loading && posts.length === 0 && (
                        <div className="p-8 text-center">
                            <RefreshCw className="w-12 h-12 text-indigo-600 animate-spin mx-auto mb-4" />
                            <p className="text-gray-600">Loading your timeline...</p>
                        </div>
                    )}

                    {/* Empty State */}
                    {!loading && posts.length === 0 && (
                        <div className="p-8 text-center">
                            <p className="text-gray-600">No posts to display. Try refreshing!</p>
                        </div>
                    )}

                    {/* Columns Container */}
                    {posts.length > 0 && (
                        <div className="p-4 overflow-x-auto columns-container">
                            <div className="flex gap-4 min-w-max">
                                {Array.from({ length: COLUMNS_TO_SHOW }).map((_, idx) => {
                                    const columnIndex = currentColumn + idx;
                                    if (columnIndex >= totalColumns) return null;
                                    
                                    const columnPosts = getColumnPosts(columnIndex);
                                    
                                    return (
                                        <div key={columnIndex} className="w-80 flex-shrink-0">
                                            <div className="bg-white rounded-xl shadow-lg p-4 mb-2">
                                                <h2 className="text-sm font-semibold text-gray-700 text-center">
                                                    Posts {columnIndex * POSTS_PER_COLUMN + 1}-{columnIndex * POSTS_PER_COLUMN + columnPosts.length}
                                                </h2>
                                            </div>
                                            
                                            <div className="space-y-4">
                                                {columnPosts.map((item) => {
                                                    const post = item.post;
                                                    return (
                                                        <div key={post.uri} className="bg-white rounded-xl shadow-lg p-4 hover:shadow-xl transition-shadow">
                                                            <div className="flex items-start gap-3 mb-3">
                                                                {post.author.avatar && (
                                                                    <img
                                                                        src={post.author.avatar}
                                                                        alt={post.author.displayName}
                                                                        className="w-10 h-10 rounded-full"
                                                                    />
                                                                )}
                                                                <div className="flex-1 min-w-0">
                                                                    <div className="font-semibold text-gray-900 truncate">
                                                                        {post.author.displayName || post.author.handle}
                                                                    </div>
                                                                    <div className="text-sm text-gray-500 truncate">
                                                                        @{post.author.handle}
                                                                    </div>
                                                                </div>
                                                                <span className="text-xs text-gray-400">
                                                                    {formatTimeAgo(post.indexedAt)}
                                                                </span>
                                                            </div>
                                                            
                                                            {post.record.text && (
                                                                <p className="text-gray-800 whitespace-pre-wrap break-words text-sm leading-relaxed">
                                                                    {post.record.text}
                                                                </p>
                                                            )}
                                                            
                                                            {post.embed?.images && post.embed.images.length > 0 && (
                                                                <div className="mt-3">
                                                                    <img
                                                                        src={post.embed.images[0].thumb}
                                                                        alt=""
                                                                        className="rounded-lg w-full"
                                                                    />
                                                                </div>
                                                            )}
                                                            
                                                            {post.embed?.external && (
                                                                <div className="mt-3 border border-gray-200 rounded-lg p-3">
                                                                    {post.embed.external.thumb && (
                                                                        <img src={post.embed.external.thumb} alt="" className="rounded w-full mb-2" />
                                                                    )}
                                                                    <div className="text-xs font-semibold text-gray-900 truncate">
                                                                        {post.embed.external.title}
                                                                    </div>
                                                                    <div className="text-xs text-gray-500 truncate">
                                                                        {post.embed.external.uri}
                                                                    </div>
                                                                </div>
                                                            )}
                                                            
                                                            <div className="mt-3 flex gap-4 text-sm text-gray-500">
                                                                <span>💬 {post.replyCount || 0}</span>
                                                                <span>🔁 {post.repostCount || 0}</span>
                                                                <span>❤️ {post.likeCount || 0}</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<BlueskyColumnFeed />, document.getElementById('root'));
    </script>
</body>
</html>
