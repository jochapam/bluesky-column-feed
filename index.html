<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bluesky Column Feed</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { overscroll-behavior-y: contain; }
    .column-scroll { -webkit-overflow-scrolling: touch; }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ChevronLeft = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    );

    const ChevronRight = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    );

    const RefreshCw = ({ className }) => (
      <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    );

    const AlertCircle = ({ className }) => (
      <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    );

    const LogOut = ({ className }) => (
      <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    );

    const Menu = ({ className }) => (
      <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    );

    const Search = ({ className }) => (
      <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    );

    const TrendingUp = ({ className }) => (
      <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
        <polyline points="17 6 23 6 23 12"></polyline>
      </svg>
    );

    const Moon = ({ className }) => (
      <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    );

    const Sun = ({ className }) => (
      <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    );

    const MessageCircle = ({ className }) => (
      <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
    );

    const Repeat = ({ className }) => (
      <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="17 1 21 5 17 9"></polyline>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <polyline points="7 23 3 19 7 15"></polyline>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
    );

    const Heart = ({ className }) => (
      <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    );

    const BlueskyColumnFeed = () => {
      const [posts, setPosts] = useState([]);
      const [loading, setLoading] = useState(false);
      const [currentColumn, setCurrentColumn] = useState(0);

      const [handle, setHandle] = useState('');
      const [password, setPassword] = useState('');
      const [authCode, setAuthCode] = useState('');
      const [needsAuthCode, setNeedsAuthCode] = useState(false);

      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [session, setSession] = useState(null);
      const [error, setError] = useState('');

      const POSTS_PER_COLUMN = 3;   // (still fixed-count columns in this version)
      const COLUMNS_TO_SHOW = 3;

      const [sidebarExpanded, setSidebarExpanded] = useState(false);
      const [darkMode, setDarkMode] = useState(false);

      // -------- Session helpers (PDS + refresh) --------
      const getPdsBaseUrl = (sess) => {
        try {
          const svc = sess?.didDoc?.service?.find((s) =>
            typeof s?.id === 'string' && s.id.includes('#atproto_pds')
          );
          return svc?.serviceEndpoint || 'https://bsky.social';
        } catch {
          return 'https://bsky.social';
        }
      };

      const persistSession = (sess) => {
        setSession(sess);
        localStorage.setItem('bluesky_session', JSON.stringify(sess));
      };

      const refreshAccessToken = async (sess) => {
        if (!sess?.refreshJwt) return null;

        const base = getPdsBaseUrl(sess);
        const resp = await fetch(`${base}/xrpc/com.atproto.server.refreshSession`, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${sess.refreshJwt}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({}),
        });

        if (!resp.ok) return null;

        const newSession = await resp.json();
        persistSession(newSession);
        return newSession.accessJwt;
      };

      // Hard reset (fixes stuck tabs)
      const hardReset = () => {
        try {
          localStorage.removeItem('bluesky_session');
          // Keep darkMode preference; comment next line if you want to reset it too
          // localStorage.removeItem('darkMode');
        } catch (e) {}

        setIsLoggedIn(false);
        setSession(null);
        setPosts([]);
        setHandle('');
        setPassword('');
        setAuthCode('');
        setNeedsAuthCode(false);
        setError('');
        setCurrentColumn(0);

        window.location.reload();
      };

      // Load saved session + theme on startup
      useEffect(() => {
        const savedSession = localStorage.getItem('bluesky_session');
        const savedDarkMode = localStorage.getItem('darkMode');

        if (savedDarkMode) setDarkMode(savedDarkMode === 'true');

        if (savedSession) {
          try {
            const sessionData = JSON.parse(savedSession);
            setSession(sessionData);
            setIsLoggedIn(true);
            fetchTimeline(sessionData); // use the session object
          } catch (e) {
            localStorage.removeItem('bluesky_session');
          }
        }
      }, []);

      // Proactive refresh: keep access token fresh in the background
      useEffect(() => {
        if (!session?.refreshJwt) return;

        const id = setInterval(() => {
          refreshAccessToken(session).catch(() => {});
        }, 2 * 60 * 1000); // every 2 minutes

        return () => clearInterval(id);
      }, [session?.refreshJwt]);

      const toggleDarkMode = () => {
        const newMode = !darkMode;
        setDarkMode(newMode);
        localStorage.setItem('darkMode', newMode);
      };

      const login = async () => {
        setLoading(true);
        setError('');
        try {
          const body = { identifier: handle, password };
          if (authCode) body.authFactorToken = authCode;

          // createSession should be called on the user's PDS, but bsky.social generally works.
          const response = await fetch('https://bsky.social/xrpc/com.atproto.server.createSession', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            if (errorData.error === 'AuthFactorTokenRequired') {
              setNeedsAuthCode(true);
              setError('Please enter the code sent to your email');
              setLoading(false);
              return;
            }
            throw new Error(errorData.message || 'Login failed. Check your credentials.');
          }

          const data = await response.json();
          persistSession(data);
          setIsLoggedIn(true);
          setNeedsAuthCode(false);
          await fetchTimeline(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const logout = () => {
        setIsLoggedIn(false);
        setSession(null);
        setPosts([]);
        setHandle('');
        setPassword('');
        setAuthCode('');
        setNeedsAuthCode(false);
        setError('');
        localStorage.removeItem('bluesky_session');
      };

      // Fetch timeline with 401 -> refresh -> retry once
      const fetchTimeline = async (sess = session) => {
        if (!sess?.accessJwt) return;

        setLoading(true);
        setError('');

        const base = getPdsBaseUrl(sess);

        const doFetch = async (jwt) => {
          return fetch(`${base}/xrpc/app.bsky.feed.getTimeline?limit=50`, {
            headers: { Authorization: `Bearer ${jwt}` },
          });
        };

        try {
          let resp = await doFetch(sess.accessJwt);

          if (resp.status === 401) {
            const newAccess = await refreshAccessToken(sess);
            if (!newAccess) throw new Error('Session expired. Please sign in again.');
            resp = await doFetch(newAccess);
          }

          if (!resp.ok) {
            const err = await resp.json().catch(() => null);
            throw new Error(err?.message ? `${resp.status}: ${err.message}` : `Failed to fetch timeline: ${resp.status}`);
          }

          const data = await resp.json();
          setPosts(data.feed || []);
          setCurrentColumn(0);
        } catch (err) {
          setError(`Error loading feed: ${err.message}`);
        } finally {
          setLoading(false);
        }
      };

      const refresh = () => {
        if (session) fetchTimeline(session);
      };

      const totalColumns = Math.ceil(posts.length / POSTS_PER_COLUMN);
      const maxColumnIndex = Math.max(0, totalColumns - COLUMNS_TO_SHOW);

      const getColumnPosts = (columnIndex) => {
        const start = columnIndex * POSTS_PER_COLUMN;
        const end = start + POSTS_PER_COLUMN;
        return posts.slice(start, end);
      };

      const formatTimeAgo = (timestamp) => {
        const now = new Date();
        const posted = new Date(timestamp);
        const diffMs = now - posted;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMins / 60);
        const diffDays = Math.floor(diffHours / 24);

        if (diffMins < 1) return 'now';
        if (diffMins < 60) return `${diffMins}m`;
        if (diffHours < 24) return `${diffHours}h`;
        return `${diffDays}d`;
      };

      // ----- Responsive column width so 3 columns always fit viewport -----
      const getSidebarWidthPx = () => (sidebarExpanded ? 256 : 64); // w-64 / w-16
      const GAP_PX = 16; // gap-4
      const PAD_PX = 16; // p-4 each side

      const columnStyle = {
        flex: `0 0 calc((100vw - ${getSidebarWidthPx()}px - ${PAD_PX * 2}px - ${(COLUMNS_TO_SHOW - 1) * GAP_PX}px) / ${COLUMNS_TO_SHOW})`,
        maxWidth: `calc((100vw - ${getSidebarWidthPx()}px - ${PAD_PX * 2}px - ${(COLUMNS_TO_SHOW - 1) * GAP_PX}px) / ${COLUMNS_TO_SHOW})`,
        minWidth: 0,
      };

      // ----- Quoted posts renderer -----
      const renderQuotedRecord = (embed) => {
        if (!embed || !embed.$type) return null;

        let recordView = null;
        let mediaView = null;

        if (embed.$type === 'app.bsky.embed.record#view') {
          recordView = embed.record;
        } else if (embed.$type === 'app.bsky.embed.recordWithMedia#view') {
          recordView = embed.record?.record;
          mediaView = embed.media;
        } else {
          return null;
        }

        if (!recordView || !recordView.$type) return null;

        const rt = recordView.$type;
        const baseCardClass =
          `mt-3 rounded-lg border p-3 ${darkMode ? 'border-gray-700 bg-gray-900/30' : 'border-gray-200 bg-gray-50'}`;

        if (rt === 'app.bsky.embed.record#viewNotFound') {
          return <div className={baseCardClass}><div className={`text-sm ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>Quoted post not found.</div></div>;
        }
        if (rt === 'app.bsky.embed.record#viewBlocked') {
          return <div className={baseCardClass}><div className={`text-sm ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>Quoted post is blocked.</div></div>;
        }
        if (rt === 'app.bsky.embed.record#viewDetached') {
          return <div className={baseCardClass}><div className={`text-sm ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>Quoted post is unavailable.</div></div>;
        }

        if (rt === 'app.bsky.embed.record#viewRecord') {
          const author = recordView.author;
          const value = recordView.value || {};
          const quotedText = value.text || '';

          return (
            <div className={baseCardClass}>
              <div className="flex items-start gap-2 mb-2">
                {author?.avatar && (
                  <img src={author.avatar} alt={author.displayName || author.handle} className="w-7 h-7 rounded-full" />
                )}
                <div className="min-w-0 flex-1">
                  <div className={`text-xs font-semibold truncate ${darkMode ? 'text-gray-200' : 'text-gray-800'}`}>
                    {author?.displayName || author?.handle || 'Unknown'}
                  </div>
                  {author?.handle && (
                    <div className={`text-xs truncate ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                      @{author.handle}
                    </div>
                  )}
                </div>
              </div>

              {quotedText ? (
                <p className={`whitespace-pre-wrap break-words text-sm leading-relaxed ${darkMode ? 'text-gray-200' : 'text-gray-800'}`}>
                  {quotedText}
                </p>
              ) : (
                <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Quoted content</p>
              )}

              {mediaView?.$type === 'app.bsky.embed.images#view' && mediaView.images?.length > 0 && (
                <div className="mt-3">
                  <img src={mediaView.images[0].thumb} alt="" className="rounded-lg w-full" />
                </div>
              )}

              {mediaView?.$type === 'app.bsky.embed.external#view' && mediaView.external && (
                <div className={`mt-3 border rounded-lg p-3 ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
                  {mediaView.external.thumb && (
                    <img src={mediaView.external.thumb} alt="" className="rounded w-full mb-2" />
                  )}
                  <div className={`text-xs font-semibold truncate ${darkMode ? 'text-white' : 'text-gray-900'}`}>
                    {mediaView.external.title}
                  </div>
                  <div className={`text-xs truncate ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                    {mediaView.external.uri}
                  </div>
                </div>
              )}
            </div>
          );
        }

        return null;
      };

      // -------- Login screen --------
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 flex items-center justify-center">
            <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
              <div className="text-center mb-6">
                <h1 className="text-3xl font-bold text-indigo-600 mb-2">Bluesky Column Feed</h1>
                <p className="text-gray-600">View your timeline in columns</p>
              </div>

              {error && (
                <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 flex gap-2">
                  <AlertCircle className="w-5 h-5 flex-shrink-0 mt-0.5" />
                  <span className="text-sm">{error}</span>
                </div>
              )}

              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Handle or Email</label>
                  <input
                    type="text"
                    value={handle}
                    onChange={(e) => setHandle(e.target.value)}
                    placeholder="username.bsky.social"
                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    disabled={needsAuthCode}
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">App Password</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••-••••-••••-••••"
                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    disabled={needsAuthCode}
                    onKeyPress={(e) => e.key === 'Enter' && !loading && handle && password && login()}
                  />
                </div>

                {needsAuthCode && (
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Verification Code</label>
                    <input
                      type="text"
                      value={authCode}
                      onChange={(e) => setAuthCode(e.target.value)}
                      placeholder="Enter code from email"
                      className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                      autoFocus
                      onKeyPress={(e) => e.key === 'Enter' && !loading && authCode && login()}
                    />
                  </div>
                )}

                <button
                  onClick={login}
                  disabled={loading || !handle || !password || (needsAuthCode && !authCode)}
                  className="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
                >
                  {loading ? 'Logging in...' : needsAuthCode ? 'Verify Code' : 'Login'}
                </button>

                {needsAuthCode && (
                  <button
                    onClick={() => {
                      setNeedsAuthCode(false);
                      setAuthCode('');
                      setError('');
                    }}
                    className="w-full text-indigo-600 py-2 rounded-lg font-semibold hover:bg-indigo-50 transition-colors"
                  >
                    Back
                  </button>
                )}

                <button
                  onClick={hardReset}
                  className="w-full mt-2 text-orange-600 py-2 rounded-lg font-semibold hover:bg-orange-50 transition-colors"
                >
                  Reset Session (fix stuck tabs)
                </button>
              </div>

              <div className="mt-6 p-4 bg-blue-50 rounded-lg">
                <p className="text-xs text-gray-700">
                  <strong>Tip:</strong> Use an App Password (not your main password) for security.
                  Create one in Settings → App Passwords on Bluesky.
                </p>
              </div>
            </div>
          </div>
        );
      }

      // -------- Main app --------
      return (
        <div className={`min-h-screen flex ${darkMode ? 'bg-gray-900' : 'bg-gradient-to-br from-blue-50 to-indigo-100'}`}>
          {/* Sidebar */}
          <div className={`shadow-lg transition-all duration-300 ${sidebarExpanded ? 'w-64' : 'w-16'} flex-shrink-0 ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
            <div className="h-full flex flex-col">
              <button
                onClick={() => setSidebarExpanded(!sidebarExpanded)}
                className={`p-4 transition-colors border-b ${darkMode ? 'hover:bg-gray-700 border-gray-700' : 'hover:bg-gray-100 border-gray-200'}`}
              >
                <Menu className={`w-6 h-6 mx-auto ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`} />
              </button>

              <div className="flex-1 overflow-y-auto">
                {sidebarExpanded && (
                  <div className="p-4">
                    <h2 className={`text-lg font-bold mb-1 ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`}>Your Timeline</h2>
                    <p className={`text-xs mb-4 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>@{session?.handle}</p>
                  </div>
                )}

                <nav className="space-y-2 px-2">
                  <button
                    onClick={refresh}
                    disabled={loading}
                    className={`w-full p-3 rounded-lg transition-colors flex items-center gap-3 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}
                    title="Refresh"
                  >
                    <RefreshCw className={`w-5 h-5 flex-shrink-0 ${loading ? 'animate-spin' : ''} ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`} />
                    {sidebarExpanded && <span className={darkMode ? 'text-gray-200' : 'text-gray-700'}>Refresh</span>}
                  </button>

                  <button
                    onClick={() => setError('Search coming soon!')}
                    className={`w-full p-3 rounded-lg transition-colors flex items-center gap-3 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}
                    title="Search"
                  >
                    <Search className={`w-5 h-5 flex-shrink-0 ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`} />
                    {sidebarExpanded && <span className={darkMode ? 'text-gray-200' : 'text-gray-700'}>Search</span>}
                  </button>

                  <button
                    onClick={() => setError('Popular posts coming soon!')}
                    className={`w-full p-3 rounded-lg transition-colors flex items-center gap-3 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}
                    title="Popular Posts"
                  >
                    <TrendingUp className={`w-5 h-5 flex-shrink-0 ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`} />
                    {sidebarExpanded && <span className={darkMode ? 'text-gray-200' : 'text-gray-700'}>Popular Posts</span>}
                  </button>

                  <button
                    onClick={toggleDarkMode}
                    className={`w-full p-3 rounded-lg transition-colors flex items-center gap-3 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}
                    title="Toggle Theme"
                  >
                    {darkMode ? <Sun className="w-5 h-5 flex-shrink-0 text-yellow-400" /> : <Moon className="w-5 h-5 flex-shrink-0 text-indigo-600" />}
                    {sidebarExpanded && <span className={darkMode ? 'text-gray-200' : 'text-gray-700'}>{darkMode ? 'Light Mode' : 'Dark Mode'}</span>}
                  </button>
                </nav>
              </div>

              <div className={`border-t ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
                <button
                  onClick={logout}
                  className={`w-full p-4 transition-colors flex items-center gap-3 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}
                  title="Sign Out"
                >
                  <LogOut className="w-5 h-5 text-red-600 flex-shrink-0" />
                  {sidebarExpanded && <span className="text-red-600">Sign Out</span>}
                </button>

                <button
                  onClick={hardReset}
                  className={`w-full p-4 transition-colors flex items-center gap-3 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}
                  title="Reset saved session (fixes stuck tabs)"
                >
                  <AlertCircle className="w-5 h-5 text-orange-500 flex-shrink-0" />
                  {sidebarExpanded && <span className="text-orange-500">Reset Session</span>}
                </button>
              </div>
            </div>
          </div>

          {/* Main */}
          <div className="flex-1 overflow-hidden">
            {error && (
              <div className="p-4">
                <div className={`px-3 py-2 rounded-lg text-sm flex gap-2 ${darkMode ? 'bg-red-900 border border-red-700 text-red-200' : 'bg-red-50 border border-red-200 text-red-700'}`}>
                  <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                  <span>{error}</span>
                </div>
              </div>
            )}

            {loading && posts.length === 0 && (
              <div className="p-8 text-center">
                <RefreshCw className="w-12 h-12 text-indigo-600 animate-spin mx-auto mb-4" />
                <p className="text-gray-600">Loading your timeline...</p>
              </div>
            )}

            {!loading && posts.length === 0 && (
              <div className="p-8 text-center">
                <p className="text-gray-600">No posts to display. Try refreshing!</p>
              </div>
            )}

            {/* Columns */}
            {posts.length > 0 && (
              <div className="h-screen overflow-hidden p-4">
                <div className="flex gap-4">
                  {Array.from({ length: COLUMNS_TO_SHOW }).map((_, idx) => {
                    const columnIndex = currentColumn + idx;
                    if (columnIndex >= totalColumns) return null;

                    const columnPosts = getColumnPosts(columnIndex);

                    return (
                      <div key={columnIndex} className="flex-shrink-0" style={columnStyle}>
                        <div
                          className="column-scroll space-y-4 pb-10 overflow-y-auto"
                          style={{ maxHeight: 'calc(100vh - 2rem)' }}
                          onScroll={(e) => {
                            const top = e.currentTarget.scrollTop;
                            document.querySelectorAll('.column-scroll').forEach((el) => {
                              if (el !== e.currentTarget) el.scrollTop = top;
                            });
                          }}
                        >
                          {columnPosts.map((item) => {
                            const post = item.post;

                            const isRepost =
                              item.reason?.$type === 'app.bsky.feed.defs#reasonRepost' ||
                              item.reason?.$type === 'app.bsky.feed.defs#skeletonReasonRepost';
                            const reposter = isRepost ? item.reason?.by : null;
                            const repostedAt = isRepost ? (item.reason?.indexedAt || item.reason?.indexed_at) : null;

                            return (
                              <div
                                key={(post?.uri || '') + '::' + (reposter?.did || '') + '::' + (repostedAt || '')}
                                className={`rounded-xl shadow-lg p-4 hover:shadow-xl transition-shadow ${darkMode ? 'bg-gray-800' : 'bg-white'}`}
                              >
                                {isRepost && reposter && (
                                  <div className={`mb-2 flex items-center gap-2 text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                                    <Repeat className="w-4 h-4" />
                                    <span>
                                      Reposted by <span className="font-semibold">@{reposter.handle}</span>
                                      {repostedAt ? ` · ${formatTimeAgo(repostedAt)}` : ''}
                                    </span>
                                  </div>
                                )}

                                <div className="flex items-start gap-3 mb-3">
                                  {post.author.avatar && (
                                    <img
                                      src={post.author.avatar}
                                      alt={post.author.displayName || post.author.handle}
                                      className="w-10 h-10 rounded-full"
                                    />
                                  )}
                                  <div className="flex-1 min-w-0">
                                    <div className={`font-semibold truncate ${darkMode ? 'text-white' : 'text-gray-900'}`}>
                                      {post.author.displayName || post.author.handle}
                                    </div>
                                    <div className={`text-sm truncate ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                                      @{post.author.handle}
                                    </div>
                                  </div>
                                  <span className={`text-xs ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>
                                    {formatTimeAgo(post.indexedAt)}
                                  </span>
                                </div>

                                {post.record?.text && (
                                  <p className={`whitespace-pre-wrap break-words text-sm leading-relaxed ${darkMode ? 'text-gray-200' : 'text-gray-800'}`}>
                                    {post.record.text}
                                  </p>
                                )}

                                {/* Images */}
                                {post.embed?.images && post.embed.images.length > 0 && (
                                  <div className="mt-3">
                                    <img src={post.embed.images[0].thumb} alt="" className="rounded-lg w-full" />
                                  </div>
                                )}

                                {/* External card */}
                                {post.embed?.external && (
                                  <div className={`mt-3 border rounded-lg p-3 ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
                                    {post.embed.external.thumb && (
                                      <img src={post.embed.external.thumb} alt="" className="rounded w-full mb-2" />
                                    )}
                                    <div className={`text-xs font-semibold truncate ${darkMode ? 'text-white' : 'text-gray-900'}`}>
                                      {post.embed.external.title}
                                    </div>
                                    <div className={`text-xs truncate ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                                      {post.embed.external.uri}
                                    </div>
                                  </div>
                                )}

                                {/* Quoted posts */}
                                {renderQuotedRecord(post.embed)}

                                <div className={`mt-4 flex gap-6 text-sm border-t pt-3 ${darkMode ? 'border-gray-700 text-gray-400' : 'border-gray-200 text-gray-500'}`}>
                                  <button className="flex items-center gap-1.5 hover:text-indigo-500 transition-colors">
                                    <MessageCircle className="w-4 h-4" />
                                    <span>{post.replyCount || 0}</span>
                                  </button>
                                  <button className="flex items-center gap-1.5 hover:text-green-500 transition-colors">
                                    <Repeat className="w-4 h-4" />
                                    <span>{post.repostCount || 0}</span>
                                  </button>
                                  <button className="flex items-center gap-1.5 hover:text-red-500 transition-colors">
                                    <Heart className="w-4 h-4" />
                                    <span>{post.likeCount || 0}</span>
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Navigation arrows (move 3 columns at a time) */}
            {posts.length > 0 && (
              <>
                <button
                  onClick={() => setCurrentColumn(Math.max(0, currentColumn - COLUMNS_TO_SHOW))}
                  disabled={currentColumn === 0}
                  className={`fixed left-20 top-1/2 -translate-y-1/2 p-3 rounded-full shadow-lg disabled:opacity-30 disabled:cursor-not-allowed z-10 ${darkMode ? 'bg-gray-800 hover:bg-gray-700' : 'bg-white hover:bg-gray-100'}`}
                  title="Previous columns"
                >
                  <ChevronLeft />
                </button>

                <button
                  onClick={() => setCurrentColumn(Math.min(maxColumnIndex, currentColumn + COLUMNS_TO_SHOW))}
                  disabled={currentColumn >= maxColumnIndex}
                  className={`fixed right-4 top-1/2 -translate-y-1/2 p-3 rounded-full shadow-lg disabled:opacity-30 disabled:cursor-not-allowed z-10 ${darkMode ? 'bg-gray-800 hover:bg-gray-700' : 'bg-white hover:bg-gray-100'}`}
                  title="Next columns"
                >
                  <ChevronRight />
                </button>
              </>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<BlueskyColumnFeed />, document.getElementById('root'));
  </script>
</body>
</html>
